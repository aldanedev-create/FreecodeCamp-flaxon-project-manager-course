[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flaxon-project-manager-course"
version = "0.1.0"
description = "Backend-first Flaxon and Teloce SPA course application"
requires-python = ">=3.11"
dependencies = ["flaxon==0.2.6+course.1", "teloce-py==0.2.6", "minifyjs==0.1.3", "uvicorn==0.38.0", "Jinja2==3.1.6", "aiosqlite==0.21.0", "argon2-cffi==25.1.0", "python-dotenv==1.2.1", "nh3==0.3.7"]

[tool.setuptools]
py-modules = ["app", "settings", "management", "flaxon_cli", "database", "security", "validation", "backoffice", "seed"]

[tool.setuptools.packages.find]
include = ["modules*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*event loop.*:DeprecationWarning"]
